<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Remote</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--text:#e8eaed;--muted:#9aa0a6;--accent:#1db954}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px}
h1{font-size:19px;margin:0 0 18px;text-align:center}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0f1115;color:var(--text);font:inherit}
button{width:100%;margin-top:20px;background:var(--accent);color:#000;border:0;border-radius:20px;padding:11px;font-weight:600;font-size:15px;cursor:pointer}
#err{color:#e5534b;font-size:13px;min-height:18px;margin-top:10px;text-align:center}
</style></head><body>
<form method="post" action="/dologin">
<h1>&#9835; Spotify Remote</h1>
<label for="u">Benutzer</label><input id="u" name="user" autocomplete="username" required autofocus>
<label for="p">Passwort</label><input id="p" name="pass" type="password" autocomplete="current-password" required>
<button type="submit">Anmelden</button>
<div id="err"></div>
</form>
<script>if(location.search.indexOf('fail')>=0) document.getElementById('err').textContent='Benutzer oder Passwort falsch';</script>
<script src="/i18n.js"></script>
</body></html>
