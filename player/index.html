<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Remote</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--text:#e8eaed;--muted:#9aa0a6;--accent:#1db954}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid #262a33;flex-wrap:wrap}
h1{font-size:15px;margin:0 8px 0 0;font-weight:600}
button{background:var(--accent);color:#000;border:0;border-radius:18px;padding:7px 16px;font-weight:600;cursor:pointer}
button.sec{background:#2a2f3a;color:var(--text)}
select{background:#2a2f3a;color:var(--text);border:1px solid #3a404c;border-radius:8px;padding:5px 8px}
input[type=range]{width:120px;accent-color:var(--accent)}
#st{color:var(--muted);font-size:12px}
iframe{flex:1;width:100%;border:0;background:#000}
</style></head><body>
<header>
<h1>Spotify Remote</h1>
<button class="sec" id="bprev" title="Vorheriger Titel">&#9198;</button><button class="sec" id="bplay" title="Spotify Play/Pause">&#9199;</button><button class="sec" id="bnext" title="N&auml;chster Titel">&#9197;</button><img id="cover" alt="" style="width:36px;height:36px;border-radius:4px;object-fit:cover;display:none"><span id="now" style="max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span><label>Ger&auml;t <select id="dev" style="max-width:220px"></select></label><span id="devinfo" style="font-size:12px"></span><button id="pl">&#9654; Ton an</button>
<label>Qualit&auml;t <select id="q"><option value="aac128">AAC 128 kbit/s (empfohlen)</option><option value="aac192">AAC 192 kbit/s</option><option value="aac256">AAC 256 kbit/s</option><option value="stream128">MP3 128 kbit/s</option><option value="stream192">MP3 192 kbit/s</option><option value="stream">MP3 320 kbit/s</option><option value="hls64">Kompatibel HLS 64 kbit/s</option><option value="hls96">Kompatibel HLS 96 kbit/s</option><option value="hls">Kompatibel HLS 128 kbit/s (Firmennetz)</option></select></label>
<label>Lautst&auml;rke <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
<label title="Lautstärke in Spotify (wirkt für alle Hörer)">Spotify <input id="svol" type="range" min="0" max="100" step="5" value="100" disabled> <span id="svoll" style="font-size:12px;color:#9aa0a6;min-width:34px;display:inline-block"></span></label><span id="st">Ton aus</span><span id="lat" title="Klick: auf Live springen" style="font-size:12px;cursor:pointer"></span><span id="mb" title="Klick: Gesamtz&auml;hler zur&uuml;cksetzen" style="color:#9aa0a6;font-size:12px;cursor:pointer"></span>
<span style="flex:1"></span>
<a href="/status.html" style="color:#9aa0a6;font-size:12px;margin-right:4px">Status</a><button class="sec" id="tg">Bild aus</button><button class="sec" id="rl">Bild neu verbinden</button>
</header><div style="display:flex;align-items:center;gap:8px;padding:0 14px;background:#181b22"><div style="flex:1;height:4px;background:#262a33;border-radius:2px;overflow:hidden"><div id="progb" style="height:4px;width:0;background:#1db954;transition:width .5s linear"></div></div><span id="tm" style="font-size:11px;color:#9aa0a6;min-width:80px;text-align:right;padding:3px 0"></span></div>
<iframe id="vnc" allow="clipboard-read; clipboard-write"></iframe>
<audio id="au" preload="none"></audio>
<script src="hls.light.min.js"></script>
<script>
const h=location.hostname, au=document.getElementById('au'), pl=document.getElementById('pl'), st=document.getElementById('st'), vnc=document.getElementById('vnc'), q=document.getElementById('q'), vol=document.getElementById('vol');
function get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
q.value=get('q','aac128'); if(!q.value) q.value='aac128'; vol.value=get('vol','0.8'); au.volume=+vol.value;
const PX=location.port!=="8080"; const vurl=(PX?location.origin+'/novnc/vnc.html?path=websockify&':'http://'+h+':6080/vnc.html?')+'autoconnect=1&resize=scale&reconnect=1&reconnect_delay=3000';
vnc.src=vurl; document.getElementById('rl').onclick=()=>{vnc.src=vurl};
let on=false, retry;
vol.oninput=e=>{au.volume=+e.target.value; set('vol',e.target.value)};
const label=()=>q.options[q.selectedIndex].text;
let hls=null, fb;
function unhls(){ if(hls){ hls.destroy(); hls=null } }
function playHls(){
  const url=location.origin+'/'+q.value+'/live.m3u8';
  if(window.Hls && Hls.isSupported()){
    hls=new Hls({liveSyncDurationCount:2, manifestLoadingMaxRetry:20, manifestLoadingRetryDelay:1500, levelLoadingMaxRetry:20, fragLoadingMaxRetry:10});
    hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal) again() });
    hls.loadSource(url); hls.attachMedia(au); hls.on(Hls.Events.MANIFEST_PARSED,()=>au.play().catch(()=>{}));
  } else { au.src=url; au.play().catch(()=>{}) }
}
function start(){st.textContent='verbinde...'; clearTimeout(fb); unhls(); const m=q.value; fetch('/api/want',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mount:m})}).catch(()=>{}).then(()=>setTimeout(()=>{ if(!on) return;
  if(m.startsWith('hls')){ playHls(); return }
  au.src=(PX?location.origin+'/':'http://'+h+':8000/')+m+'?t='+Date.now(); au.play().catch(()=>{});
  // kommt nach 10 s kein Ton (z. B. Firmen-Proxy haelt den Dauerstream fest): auf HLS umschalten
  if(PX) fb=setTimeout(()=>{ if(on && (au.paused || au.readyState<3)){ q.value='hls'; set('q','hls'); start() } },10000);
 }, m==='aac128'?0:(m.startsWith('hls')?4000:1800)))}
function stop(){on=false; clearTimeout(retry); clearTimeout(fb); unhls(); au.pause(); au.removeAttribute('src'); au.load(); pl.innerHTML='&#9654; Ton an'; st.textContent='Ton aus'}
pl.onclick=()=>{ if(on){stop()} else {on=true; pl.innerHTML='&#10074;&#10074; Ton aus'; start()} };
q.onchange=()=>{ set('q',q.value); if(on) start() };
au.addEventListener('playing',()=>st.textContent='läuft ('+label()+')');
function again(){ if(!on) return; st.textContent='Verbindung weg, neuer Versuch...'; clearTimeout(retry); retry=setTimeout(start,3000) }
au.addEventListener('error',again); au.addEventListener('ended',again);
</script><script src="mobile.js"></script><script src="stats.js"></script><script src="view.js"></script><script src="screen.js"></script><script src="lat.js"></script><script src="controls.js"></script><script src="devices.js"></script><script src="media.js"></script><script src="volume.js"></script><script src="extras.js"></script><script src="i18n.js"></script></body></html>
