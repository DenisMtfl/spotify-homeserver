; Dienste im Docker-Container (entspricht den systemd-Units der LXC-Variante)

[unix_http_server]
file=/run/supervisor.sock
chmod=0770
chown=root:spotify

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:icecast]
command=/usr/bin/icecast2 -c /etc/icecast2/icecast.xml
user=icecast2
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:desktop]
command=/home/spotify/run.sh
user=spotify
environment=HOME="/home/spotify",USER="spotify",XDG_RUNTIME_DIR="/tmp/xdg-spotify",PA_LOG_TARGET="stderr"
priority=20
startsecs=10
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Encoder: AAC 128 laeuft immer, alle anderen startet die Weboberflaeche bei Bedarf
[program:enc_aac128]
command=/opt/player/enc.sh aac128
user=spotify
environment=HOME="/home/spotify",XDG_RUNTIME_DIR="/tmp/xdg-spotify",ICEPW="%(ENV_ICEPW)s"
priority=30
autostart=true
autorestart=true
startretries=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:enc_aac192]
command=/opt/player/enc.sh aac192
user=spotify
environment=HOME="/home/spotify",XDG_RUNTIME_DIR="/tmp/xdg-spotify",ICEPW="%(ENV_ICEPW)s"
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:enc_aac256]
command=/opt/player/enc.sh aac256
user=spotify
environment=HOME="/home/spotify",XDG_RUNTIME_DIR="/tmp/xdg-spotify",ICEPW="%(ENV_ICEPW)s"
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:enc_stream]
command=/opt/player/enc.sh stream
user=spotify
environment=HOME="/home/spotify",XDG_RUNTIME_DIR="/tmp/xdg-spotify",ICEPW="%(ENV_ICEPW)s"
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:enc_stream192]
command=/opt/player/enc.sh stream192
user=spotify
environment=HOME="/home/spotify",XDG_RUNTIME_DIR="/tmp/xdg-spotify",ICEPW="%(ENV_ICEPW)s"
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:enc_stream128]
command=/opt/player/enc.sh stream128
user=spotify
environment=HOME="/home/spotify",XDG_RUNTIME_DIR="/tmp/xdg-spotify",ICEPW="%(ENV_ICEPW)s"
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=/usr/bin/python3 /opt/player/server.py
user=spotify
environment=HOME="/home/spotify",XDG_RUNTIME_DIR="/tmp/xdg-spotify",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/xdg-spotify/bus",SERVICE_MANAGER="supervisor"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
